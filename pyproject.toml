[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "pymaceuticals"
version = "1.0.0"
description = "Pymaceuticals mouse-study analysis: cleaned merge, per-regimen statistics, IQR outliers, weight/volume regression, one-way ANOVA with Tukey HSD, Kaplan-Meier survival with a log-rank test, and a generated report."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Freddrick Logan" }]
dependencies = ["numpy>=2.0", "pandas>=2.2", "scipy>=1.14", "statsmodels>=0.14", "typer>=0.12"]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-cov>=5.0", "ruff>=0.6", "mypy>=1.11", "pandas-stubs>=2.2", "bandit>=1.7", "pip-audit>=2.7"]

[project.scripts]
pymaceuticals = "pymaceuticals.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/pymaceuticals"]

[tool.hatch.build]
include = ["src/pymaceuticals/**"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "C4", "DTZ", "S", "SIM", "RUF", "T20", "PTH", "RET", "ARG"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "ARG001"]
"src/pymaceuticals/cli.py" = ["T20"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["scipy", "scipy.*", "statsmodels", "statsmodels.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["pymaceuticals"]
omit = ["src/pymaceuticals/cli.py"]

[tool.coverage.report]
show_missing = true
